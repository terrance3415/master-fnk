[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrance-video-remaster"
version = "1.0.0"
description = "Local compact Real-ESRGAN remaster to software AV1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.5.4",
  "opencv-python-headless==5.0.0.93",
  "playwright==1.64.1",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[project.scripts]
remaster = "remaster.cli:main"

[tool.setuptools.packages.find]
include = ["remaster*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
